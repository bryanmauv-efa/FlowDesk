# Compilation de controle sur Windows.
#
# Le compilateur XAML du Windows App SDK est un executable Windows : ni Linux ni macOS ne
# peuvent le lancer. Cette compilation est donc le seul moyen de verifier qu'une modification
# tient debout de bout en bout — code C#, XAML compiles et ressources comprises — sans avoir
# un poste Windows sous la main.
#
# Elle ne remplace pas compilation.bat, qui produit l'executable unique a distribuer.

name: Compilation Windows

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  compiler:
    name: Compiler l'application
    runs-on: windows-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer le SDK .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurer les paquets
        run: dotnet restore app/TermServMultiScreen.csproj -r win-x64

      - name: Compiler (Release)
        run: dotnet build app/TermServMultiScreen.csproj -c Release -r win-x64 --no-restore

      # Les memes options que compilation.bat : un seul fichier autonome, tout embarque.
      # La question de version, elle, ne se pose pas ici — la valeur du csproj est reprise
      # telle quelle, une compilation automatique ne doit rien decider a la place de personne.
      - name: Produire l'executable autonome
        run: >
          dotnet publish app/TermServMultiScreen.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:WindowsAppSDKSelfContained=true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishReadyToRun=false
          -p:DebugType=none
          -o publication

      - name: Verifier le fichier produit
        shell: pwsh
        run: |
          $exe = Get-Item publication/TermServMultiScreen.exe
          "{0} — {1:N1} Mo" -f $exe.Name, ($exe.Length / 1MB)

      # Executable NON SIGNE : signer-release.ps1 exige private_key.xml, qui n'est pas dans le
      # depot et n'a rien a y faire. La signature reste une etape locale, sur le poste qui
      # detient la cle.
      - name: Publier l'executable en artefact
        uses: actions/upload-artifact@v4
        with:
          name: TermServMultiScreen-win-x64-non-signe
          path: publication/TermServMultiScreen.exe
          retention-days: 7
          if-no-files-found: error
